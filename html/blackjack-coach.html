<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackjack Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column on a casino-felt ground, so desktop testing matches the mobile app. */
/* Deliberately single-theme: the felt table is the identity, in either host theme. */
:root {
  color-scheme: dark;
  --felt: #0b5d3b;
  --felt-deep: #073f28;
  --felt-lift: #127a4f;
  --rail: #2a1a10;
  --gold: #e8c547;
  --ink: #f4f1e8;
  --muted: #b7c9be;
  --paper: #ffffff;
  --card-ink: #1a1a1a;
  --card-red: #c8323c;
  --card-back: #8e1b2c;
  --good: #4ade80;
  --bad: #ff8a8a;
  --warn: #fbbf24;
  --shade: rgba(0, 0, 0, 0.28);
  --font-display: "Cinzel", "Georgia", "Times New Roman", serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, var(--felt-lift) 0%, var(--felt) 45%, var(--felt-deep) 100%) fixed, var(--felt);
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
}
a { color: var(--gold); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--rail);
  border-bottom: 3px solid var(--gold);
  box-shadow: 0 2px 10px var(--shade);
}
.bar-inner { max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.bar h1 { margin: 0; font: 800 18px/1.2 var(--font-display); letter-spacing: 0.06em; color: var(--ink); text-wrap: balance; }
#back { color: var(--gold); text-decoration: none; font-size: 26px; line-height: 1; padding: 0 4px; }

main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 96px; display: flex; flex-direction: column; gap: 14px; }
main > * { margin: 0; }
h2 { font: 800 17px/1.3 var(--font-display); letter-spacing: 0.05em; color: var(--gold); margin: 10px 0 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.fine { color: var(--muted); font-size: 12px; text-align: center; }
.good { color: var(--good); font-weight: 700; }
.bad { color: var(--bad); font-weight: 700; }
kbd { font: 600 11px var(--font-body); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; opacity: 0.7; }

/* Home */
.hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 8px; }
.hero h1 { margin: 0; font: 800 32px/1.1 var(--font-display); letter-spacing: 0.04em; text-wrap: balance; }
.hero-cards { display: flex; margin-bottom: 4px; }
.hero-cards .card-wrap:first-child { transform: rotate(-8deg); }
.hero-cards .card-wrap:last-child { transform: rotate(8deg); margin-left: -10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--shade); border-radius: 12px; padding: 14px 8px; }
.stats div { display: flex; flex-direction: column; align-items: center; }
.stats b { color: var(--gold); font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: 13px; }

.tiles, .list { display: flex; flex-direction: column; gap: 10px; }
.tile {
  display: flex; align-items: center; gap: 14px;
  background: var(--felt-deep); border: 1px solid transparent; border-radius: 12px;
  padding: 14px 16px; color: var(--ink); text-decoration: none;
  transition: border-color 0.15s, transform 0.15s;
}
.tile:hover { border-color: var(--gold); transform: translateY(-1px); }
.tile-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tile-text b { font-size: 17px; }
.tile-text span { color: var(--muted); font-size: 14px; }
.chev { color: var(--muted); font-size: 26px; }
.badge { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px solid var(--gold); color: var(--gold); display: grid; place-items: center; font-weight: 800; }
.badge.done { background: var(--gold); color: var(--card-ink); }

/* Panels and buttons */
.panel { background: var(--shade); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel.complete { border: 1px solid var(--gold); }
.done { color: var(--gold); font: 800 18px var(--font-display); text-align: center; }
.q, .prompt { font-weight: 700; font-size: 17px; }
.prompt { text-align: center; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row .btn { flex: 1 1 90px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  font: 700 16px var(--font-body); color: var(--ink); text-decoration: none; text-align: center;
  padding: 11px 14px; border-radius: 12px; border: 2px solid transparent; cursor: pointer;
  transition: transform 0.08s, opacity 0.15s, box-shadow 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: var(--card-ink); }
.btn.secondary { background: var(--felt-lift); }
.btn.ghost { background: transparent; border-color: var(--muted); }
.btn.danger { background: #7a1f2b; }
.btn.glow { border-color: var(--gold); box-shadow: 0 0 14px var(--gold); }
.hint { color: var(--gold); font-weight: 700; text-align: center; }
.keys { color: var(--muted); font-size: 12px; text-align: center; }
.feedback { border-radius: 12px; padding: 12px 14px; background: var(--shade); border-left: 4px solid; font-weight: 600; }
.feedback.ok { border-color: var(--good); color: var(--good); }
.feedback.no { border-color: var(--bad); color: var(--bad); }

/* Lesson */
.lesson { display: flex; flex-direction: column; gap: 14px; }
.lesson section { display: flex; flex-direction: column; gap: 8px; }
.lesson p { max-width: 65ch; }
.card-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Cards */
.card-wrap { display: inline-flex; flex-direction: column; align-items: center; }
.card {
  position: relative; background: var(--paper); color: var(--card-ink);
  border-radius: 7px; box-shadow: 0 2px 5px var(--shade);
  display: grid; place-items: center; flex: none;
}
.card.red { color: var(--card-red); }
.card.md { width: 64px; height: 92px; }
.card.sm { width: 46px; height: 66px; }
.card.lg { width: 110px; height: 158px; }
.card .idx { position: absolute; top: 4px; left: 6px; font-weight: 700; line-height: 1; text-align: center; font-size: 15px; }
.card .idx.flip { top: auto; left: auto; bottom: 4px; right: 6px; transform: rotate(180deg); }
.card .pip { font-size: 28px; }
.card.sm .idx { font-size: 12px; top: 3px; left: 4px; }
.card.sm .idx.flip { bottom: 3px; right: 4px; top: auto; left: auto; }
.card.sm .pip { font-size: 20px; }
.card.lg .idx { font-size: 22px; }
.card.lg .pip { font-size: 52px; }
.card.back { background: repeating-linear-gradient(45deg, var(--card-back) 0 6px, #a3263a 6px 12px); border: 4px solid var(--paper); }
.tag { margin-top: 4px; font-weight: 800; font-size: 14px; color: var(--muted); }
.tag.plus { color: var(--good); }
.tag.minus { color: var(--bad); }

/* Table */
.topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.bankroll { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
.count { background: var(--shade); color: var(--ink); border: 1px solid var(--felt-lift); border-radius: 999px; padding: 4px 12px; font: 600 14px var(--font-body); font-variant-numeric: tabular-nums; cursor: pointer; }
.shuffle { color: var(--warn); text-align: center; font-size: 13px; }
.felt { border: 2px solid rgba(232, 197, 71, 0.35); border-radius: 120px 120px 18px 18px; padding: 18px 10px; background: rgba(0, 0, 0, 0.08); display: flex; flex-direction: column; gap: 10px; }
.felt.drill { border-radius: 18px; align-items: center; }
.area { min-height: 132px; display: flex; align-items: center; justify-content: center; }
.players { flex-wrap: wrap; gap: 8px; }
.rules-line { color: var(--muted); text-align: center; font-size: 14px; }
.hand { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px; border: 2px solid transparent; border-radius: 10px; }
.hand.active { border-color: var(--gold); }
.hand-cards { display: flex; }
.hand-cards > * + * { margin-left: -16px; }
.hand-label { font-size: 14px; }
.actions .btn { flex: 1 1 96px; }

/* Drills */
.score-row { display: flex; justify-content: space-between; color: var(--gold); font-weight: 700; flex-wrap: wrap; gap: 6px; }
.flash { display: flex; gap: 16px; justify-content: center; min-height: 170px; align-items: center; padding-top: 20px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.guess { font-size: 26px; font-weight: 800; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
.guess.big, .big { font-size: 26px; font-weight: 800; }
.lbl { color: var(--muted); font-weight: 600; font-size: 14px; }
.seg { display: flex; background: var(--felt-deep); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--ink); font: 600 14px var(--font-body); padding: 8px 4px; border-radius: 9px; cursor: pointer; }
.seg button.on { background: var(--gold); color: var(--card-ink); }

/* Chart */
.chart-wrap { overflow-x: auto; }
.chart { border-collapse: separate; border-spacing: 2px; width: 100%; min-width: 340px; font-variant-numeric: tabular-nums; }
.chart th { color: var(--gold); font-size: 13px; padding: 2px; }
.chart td { text-align: center; font-weight: 700; font-size: 12px; color: var(--card-ink); border-radius: 3px; height: 28px; }
.c-H { background: #d9d9d9; color: var(--card-ink); }
.c-S { background: #f2c94c; color: var(--card-ink); }
.c-D { background: #6fcf97; color: var(--card-ink); }
.c-P { background: #56ccf2; color: var(--card-ink); }
.c-R { background: #eb8b8b; color: var(--card-ink); }
.legend { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.legend li { display: flex; align-items: center; gap: 10px; }
.legend span { width: 34px; text-align: center; font-weight: 700; font-size: 12px; border-radius: 3px; padding: 2px 0; }

/* Settings */
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 0; cursor: pointer; }
.toggle span { display: flex; flex-direction: column; min-width: 0; }
.toggle small { color: var(--muted); font-size: 13px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); flex: none; }

/* Ad placeholders (real ads only run in the mobile app) */
.ad-strip {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: #111; color: #9aa; border-top: 1px dashed #555;
  text-align: center; font-size: 12px; line-height: 50px; letter-spacing: 0.04em;
}
.ad-overlay { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, 0.85); display: grid; place-items: center; padding: 16px; }
.ad-box { background: #1b1b1b; color: #ddd; border: 1px dashed #666; border-radius: 12px; padding: 28px 20px; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
.ad-box b { color: #fff; font-size: 18px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

</div>
<script>"use strict";(()=>{var H=[{id:"rules",unit:"Basics",title:"How Blackjack Works",summary:"The goal, card values, and how a round plays out.",sections:[{body:'You play against the dealer, not the other players. The goal is to finish with a higher total than the dealer without going over 21. Going over is a "bust" and you lose right away, even if the dealer busts later.'},{heading:"Card values",body:"Cards 2\u201310 are worth their number. Jacks, Queens and Kings are worth 10. An Ace is worth 1 or 11, whichever helps you more.",cards:["7","K","A"]},{heading:"Blackjack",body:'An Ace plus any 10-value card as your first two cards is a "blackjack" (or "natural"). It usually pays 3 to 2: bet $10, win $15. Avoid tables that pay 6 to 5; that small change more than triples the house edge.',cards:["A","Q"]},{heading:"How a round goes",body:`1. Place your bet.
2. You get two cards face up. The dealer gets one face up (the "upcard") and one face down (the "hole card").
3. If the dealer shows an Ace or 10, they check for blackjack.
4. You play your hand.
5. The dealer reveals the hole card and must hit until reaching 17 or more. The dealer has no choices; the rules decide every move.`}],quiz:[{question:"You have K and 7. What is your total?",options:["7","17","27"],answer:1,explanation:"Face cards are worth 10, so K + 7 = 17."},{question:"You bust with 23, then the dealer busts with 24. What happens?",options:["Push (tie)","You win","You lose"],answer:2,explanation:"You act first, so your bust loses immediately. This is where the house gets its edge."}],practice:{label:"Play a few hands",href:"/play"}},{id:"soft-hard",unit:"Basics",title:"Soft and Hard Hands",summary:"Why an Ace changes how you play.",sections:[{body:`A hand with an Ace counted as 11 is "soft". It can't bust on the next card, because the Ace can drop back to 1.`,cards:["A","6"]},{body:`A + 6 is "soft 17". If you hit and draw a 9, the Ace becomes 1 and you have a hard 16. You didn't bust.`,cards:["A","6","9"]},{heading:"Hard hands",body:'Any hand without an Ace, or where the Ace has to count as 1, is "hard". Hard 12\u201316 are the "stiff" hands: one card can bust you, and they are the hardest hands to play well.',cards:["10","6"]}],quiz:[{question:"What is A + 5 + 10?",options:["Soft 16","Hard 16","Bust (26)"],answer:1,explanation:"Counting the Ace as 11 would make 26, so it counts as 1: a hard 16."},{question:"Can a soft 18 bust by taking one card?",options:["Yes","No"],answer:1,explanation:"The Ace can always drop from 11 to 1, so a single card never busts a soft hand."}]},{id:"actions",unit:"Basics",title:"Your Options",summary:"Hit, stand, double, split and surrender.",sections:[{heading:"Hit",body:"Take another card. You can keep hitting until you stand or bust."},{heading:"Stand",body:"Keep your total and end your turn."},{heading:"Double down",body:"Double your bet and take exactly one more card. You can only do this on your first two cards. Use it when you're likely to win, like 11 against a dealer 6.",cards:["6","5"]},{heading:"Split",body:"With a pair, put up a second bet and play each card as its own hand. Each hand gets a second card.",cards:["8","8"]},{heading:"Surrender",body:"Some casinos let you give up your first two cards and get half your bet back. It's the right play for a few hands that lose very often, like 16 against a 10."},{heading:"Insurance",body:"When the dealer shows an Ace, you can bet half your wager that they have blackjack. Without counting cards, it's a bad bet: always decline it. Card counters take it when the count is high enough."}],quiz:[{question:"When are you allowed to double down?",options:["Any time","Only on your first two cards","Only with a pair"],answer:1,explanation:"Doubling is only offered on your first two cards (and on split hands at most casinos)."},{question:"Should a basic strategy player take insurance?",options:["Yes, always","Only with a good hand","No, never"],answer:2,explanation:"Insurance has a big house edge unless you know the deck is rich in 10s, which takes counting."}]},{id:"basic-strategy",unit:"Strategy",title:"Basic Strategy: The Big Ideas",summary:"The mathematically best play for every hand, explained simply.",sections:[{body:"Basic strategy is the best play for every combination of your hand and the dealer's upcard, worked out by computer. Played perfectly, it cuts the house edge to about 0.5%. You can memorise it from a few simple ideas."},{heading:"1. Assume the hole card is a 10",body:'About 4 in every 13 cards are worth 10. So when the dealer shows a 7, think "probably 17". Showing a 10, think "probably 20".'},{heading:'2. Dealer 2\u20136 are "bust cards"',body:"With a 4, 5 or 6 up, the dealer will probably end up with a stiff hand and have to hit it. Against these cards, stand on 12\u201316 and let the dealer bust. (Against a 2 or 3, hit 12.)",cards:["5"]},{heading:"3. Against 7 through Ace, hit until 17",body:"The dealer probably has a strong hand. Standing on 12\u201316 usually loses, so keep hitting until you reach 17.",cards:["10"]},{heading:"4. Double when you have the edge",body:"Double 11 against everything but an Ace, 10 against 2\u20139, and 9 against 3\u20136. Double soft hands (like A-7) against weak dealer cards."},{heading:"5. Always and never",body:"Always split Aces and 8s. Never split 10s or 5s. Never take insurance.",cards:["A","A"]}],quiz:[{question:"You have 14. The dealer shows a 6. What do you do?",options:["Hit","Stand","Double"],answer:1,explanation:"6 is a bust card. Stand and let the dealer take the risk."},{question:"You have 15. The dealer shows a 9. What do you do?",options:["Hit","Stand","Surrender"],answer:0,explanation:"The dealer probably has 19. Standing on 15 almost always loses, so hit."},{question:"You have 10, 10. The dealer shows a 6. What do you do?",options:["Split","Stand","Double"],answer:1,explanation:"20 is a great hand. Never break it up (unless you're counting and the count is very high)."}],practice:{label:"Drill basic strategy",href:"/drills/strategy"}},{id:"why-counting",unit:"Counting",title:"Why Card Counting Works",summary:"High cards help you; low cards help the dealer.",sections:[{body:"Cards that have been played don't come back until the shuffle. So the cards left in the shoe change as the game goes on, and so do your odds."},{heading:"When lots of 10s and Aces remain",body:`\u2022 You get more blackjacks, which pay 3 to 2. The dealer gets them too but only wins even money.
\u2022 The dealer busts more often, because they must hit stiff hands.
\u2022 Your double downs win more often.`,cards:["10","A","K"]},{heading:"When lots of small cards remain",body:"Small cards help the dealer make hands without busting. The game gets worse for you.",cards:["4","5","6"]},{heading:"The plan",body:"Counting tracks whether the remaining cards are rich in high cards or low cards. Bet small when they're low, bet bigger when they're high. No memorising every card, and it is not illegal. It just takes practice."}],quiz:[{question:"Which shoe is better for the player?",options:["Rich in small cards","Rich in 10s and Aces","It doesn't matter"],answer:1,explanation:"High cards mean more blackjacks for you and more dealer busts."}]},{id:"hi-lo",unit:"Counting",title:"The Hi-Lo Count",summary:"The most popular counting system: +1, 0, \u22121.",sections:[{body:'Hi-Lo gives every card a tag. Add up the tags of every card you see to get the "running count".'},{heading:"2 through 6: +1",body:"Low cards leaving the shoe are good for you.",cards:["2","3","4","5","6"],showTags:!0},{heading:"7, 8, 9: 0",body:"Neutral cards. Ignore them.",cards:["7","8","9"],showTags:!0},{heading:"10s and Aces: \u22121",body:"High cards leaving the shoe are bad for you.",cards:["10","J","Q","K","A"],showTags:!0},{heading:"Balanced count",body:"There are 5 plus-cards and 5 minus-cards per suit, so a full deck counts to exactly 0. A great way to practice: count down a real deck and check you finish at 0."}],quiz:[{question:"What is the Hi-Lo tag for a 9?",options:["+1","0","\u22121"],answer:1,explanation:"7, 8 and 9 are neutral."},{question:"You see K, 5, 3, A, 6. What is the running count?",options:["+1","0","+3"],answer:0,explanation:"K \u22121, 5 +1, 3 +1, A \u22121, 6 +1. Total: +1."}],practice:{label:"Practice the running count",href:"/drills/count"}},{id:"running-count",unit:"Counting",title:"Keeping the Running Count",summary:"Tricks to count fast and accurately.",sections:[{heading:"Cancel pairs",body:"A high card and a low card cancel out. Don't add them one by one. Spot pairs that cancel and only count what's left.",cards:["K","5","9","4"],showTags:!0},{body:"Above: K and 5 cancel, 9 is zero, so the whole group is just +1 from the 4."},{heading:"Count every card you see",body:"Include other players' cards, the dealer's hole card once it's turned over, and every hit card. Keep the count going from hand to hand until the shuffle, then start again at 0."},{heading:"Speed goal",body:"Practice until you can count down a full deck in under 30 seconds and finish on 0. Then add distractions, like talking or music."}],quiz:[{question:"The dealer shuffles. What is the running count now?",options:["Keep the old count","0","+1"],answer:1,explanation:"A new shoe resets the count to 0."}],practice:{label:"Practice the running count",href:"/drills/count"}},{id:"true-count",unit:"Counting",title:"The True Count",summary:"Adjusting for how many decks are left.",sections:[{body:"A running count of +6 is huge with one deck left, but not much with five decks left. The true count fixes this."},{heading:"The formula",body:`True count = running count \xF7 decks remaining.

Running count +6 with 3 decks left \u2192 true count +2.
Running count +6 with 1.5 decks left \u2192 true count +4.`},{heading:"Estimating decks remaining",body:"Look at the discard tray, estimate how many decks have been played, and subtract that from the total. Half-deck accuracy is good enough. In this app, the table shows the decks remaining so you can practice the math."},{heading:"Rounding",body:"For betting, most counters round the true count down (+2.7 becomes +2). That keeps you careful with your bets."}],quiz:[{question:"Running count +8, 4 decks left. True count?",options:["+2","+4","+8"],answer:0,explanation:"8 \xF7 4 = +2."},{question:"Running count \u22123, 1 deck left. True count?",options:["\u22121","\u22123","0"],answer:1,explanation:"\u22123 \xF7 1 = \u22123. Bet the minimum."}],practice:{label:"Practice true count conversions",href:"/drills/true-count"}},{id:"betting",unit:"Counting",title:"Betting With the Count",summary:"Turn the count into an edge.",sections:[{body:"Each +1 of true count is worth about +0.5% to you. In a typical game you start around \u22120.5%, so you have the edge from about +1 or +2."},{heading:"A simple bet spread",body:`True count +1 or less: 1 unit
True count +2: 2 units
True count +3: 4 units
True count +4: 6 units
True count +5 or more: 8 units`},{heading:"Bankroll",body:"Even with an edge, swings are big. Counters keep a bankroll of hundreds of betting units to avoid going broke during losing streaks. Never bet money you can't afford to lose."},{heading:"Reality check",body:"Counting is legal, but casinos can refuse your action or ask you to stop playing. Big, obvious bet jumps attract attention. Use this app to learn the skill and the math."}],quiz:[{question:"True count is +3. Using the spread above, how many units do you bet?",options:["1","4","8"],answer:1,explanation:"+3 \u2192 4 units."}],practice:{label:"Play with the count shown",href:"/play"}},{id:"deviations",unit:"Counting",title:"Insurance and Index Plays",summary:"When the count changes how you play your hand.",sections:[{heading:"Insurance at +3",body:"Insurance pays 2 to 1. It becomes a good bet when more than 1 in 3 remaining cards is a 10. That happens at a Hi-Lo true count of about +3. Take insurance at +3 or higher, never below."},{heading:"Index plays",body:`Some basic-strategy plays change with the count. Each one has an "index", the true count at which you switch. The most important ones:

\u2022 16 vs 10: stand at 0 or higher (hit when negative)
