<title>Blackjack Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column on a casino-felt ground, so desktop testing matches the mobile app. */
/* Deliberately single-theme: the felt table is the identity, in either host theme. */
:root {
  color-scheme: dark;
  --felt: #0b5d3b;
  --felt-deep: #073f28;
  --felt-lift: #127a4f;
  --rail: #2a1a10;
  --gold: #e8c547;
  --ink: #f4f1e8;
  --muted: #b7c9be;
  --paper: #ffffff;
  --card-ink: #1a1a1a;
  --card-red: #c8323c;
  --card-back: #8e1b2c;
  --good: #4ade80;
  --bad: #ff8a8a;
  --warn: #fbbf24;
  --shade: rgba(0, 0, 0, 0.28);
  --font-display: "Cinzel", "Georgia", "Times New Roman", serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, var(--felt-lift) 0%, var(--felt) 45%, var(--felt-deep) 100%) fixed, var(--felt);
  color: var(--ink);
  font: 16px/1.5 var(--font-body);
}
a { color: var(--gold); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--rail);
  border-bottom: 3px solid var(--gold);
  box-shadow: 0 2px 10px var(--shade);
}
.bar-inner { max-width: 560px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.bar h1 { margin: 0; font: 800 18px/1.2 var(--font-display); letter-spacing: 0.06em; color: var(--ink); text-wrap: balance; }
#back { color: var(--gold); text-decoration: none; font-size: 26px; line-height: 1; padding: 0 4px; }

main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 96px; display: flex; flex-direction: column; gap: 14px; }
main > * { margin: 0; }
h2 { font: 800 17px/1.3 var(--font-display); letter-spacing: 0.05em; color: var(--gold); margin: 10px 0 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.fine { color: var(--muted); font-size: 12px; text-align: center; }
.good { color: var(--good); font-weight: 700; }
.bad { color: var(--bad); font-weight: 700; }
kbd { font: 600 11px var(--font-body); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; opacity: 0.7; }

/* Home */
.hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 8px; }
.hero h1 { margin: 0; font: 800 32px/1.1 var(--font-display); letter-spacing: 0.04em; text-wrap: balance; }
.hero-cards { display: flex; margin-bottom: 4px; }
.hero-cards .card-wrap:first-child { transform: rotate(-8deg); }
.hero-cards .card-wrap:last-child { transform: rotate(8deg); margin-left: -10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--shade); border-radius: 12px; padding: 14px 8px; }
.stats div { display: flex; flex-direction: column; align-items: center; }
.stats b { color: var(--gold); font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: 13px; }

.tiles, .list { display: flex; flex-direction: column; gap: 10px; }
.tile {
  display: flex; align-items: center; gap: 14px;
  background: var(--felt-deep); border: 1px solid transparent; border-radius: 12px;
  padding: 14px 16px; color: var(--ink); text-decoration: none;
  transition: border-color 0.15s, transform 0.15s;
}
.tile:hover { border-color: var(--gold); transform: translateY(-1px); }
.tile-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tile-text b { font-size: 17px; }
.tile-text span { color: var(--muted); font-size: 14px; }
.chev { color: var(--muted); font-size: 26px; }
.badge { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px solid var(--gold); color: var(--gold); display: grid; place-items: center; font-weight: 800; }
.badge.done { background: var(--gold); color: var(--card-ink); }

/* Panels and buttons */
.panel { background: var(--shade); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel.complete { border: 1px solid var(--gold); }
.done { color: var(--gold); font: 800 18px var(--font-display); text-align: center; }
.q, .prompt { font-weight: 700; font-size: 17px; }
.prompt { text-align: center; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row .btn { flex: 1 1 90px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  font: 700 16px var(--font-body); color: var(--ink); text-decoration: none; text-align: center;
  padding: 11px 14px; border-radius: 12px; border: 2px solid transparent; cursor: pointer;
  transition: transform 0.08s, opacity 0.15s, box-shadow 0.15s;
}
.btn:active { transform: scale(0.92); transition-duration: 0.04s; }
.btn:not(:disabled):hover { transform: translateY(-2px); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: var(--card-ink); }
.btn.secondary { background: var(--felt-lift); }
.btn.ghost { background: transparent; border-color: var(--muted); }
.btn.danger { background: #7a1f2b; }
.btn.glow { border-color: var(--gold); box-shadow: 0 0 14px var(--gold); }
.hint { color: var(--gold); font-weight: 700; text-align: center; }
.keys { color: var(--muted); font-size: 12px; text-align: center; }
.feedback { border-radius: 12px; padding: 12px 14px; background: var(--shade); border-left: 4px solid; font-weight: 600; }
.feedback.ok { border-color: var(--good); color: var(--good); }
.feedback.no { border-color: var(--bad); color: var(--bad); }

/* Lesson */
.lesson { display: flex; flex-direction: column; gap: 14px; }
.lesson section { display: flex; flex-direction: column; gap: 8px; }
.lesson p { max-width: 65ch; }
.card-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Cards */
.card-wrap { display: inline-flex; flex-direction: column; align-items: center; }
.card {
  position: relative; background: var(--paper); color: var(--card-ink);
  border-radius: 7px; box-shadow: 0 2px 5px var(--shade);
  display: grid; place-items: center; flex: none;
}
.card.red { color: var(--card-red); }
.card.md { width: 64px; height: 92px; }
.card.sm { width: 46px; height: 66px; }
.card.lg { width: 110px; height: 158px; }
.card .idx { position: absolute; top: 4px; left: 6px; font-weight: 700; line-height: 1; text-align: center; font-size: 15px; }
.card .idx.flip { top: auto; left: auto; bottom: 4px; right: 6px; transform: rotate(180deg); }
.card .pip { font-size: 28px; }
.card.sm .idx { font-size: 12px; top: 3px; left: 4px; }
.card.sm .idx.flip { bottom: 3px; right: 4px; top: auto; left: auto; }
.card.sm .pip { font-size: 20px; }
.card.lg .idx { font-size: 22px; }
.card.lg .pip { font-size: 52px; }
.card.back { background: repeating-linear-gradient(45deg, var(--card-back) 0 6px, #a3263a 6px 12px); border: 4px solid var(--paper); }
.tag { margin-top: 4px; font-weight: 800; font-size: 14px; color: var(--muted); }
.tag.plus { color: var(--good); }
.tag.minus { color: var(--bad); }

/* Table */
.topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.bankroll { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
.count { background: var(--shade); color: var(--ink); border: 1px solid var(--felt-lift); border-radius: 999px; padding: 4px 12px; font: 600 14px var(--font-body); font-variant-numeric: tabular-nums; cursor: pointer; }
.shuffle { color: var(--warn); text-align: center; font-size: 13px; }
.felt { border: 2px solid rgba(232, 197, 71, 0.35); border-radius: 120px 120px 18px 18px; padding: 18px 10px; background: rgba(0, 0, 0, 0.08); display: flex; flex-direction: column; gap: 10px; }
.felt.drill { border-radius: 18px; align-items: center; }
.area { min-height: 132px; display: flex; align-items: center; justify-content: center; }
.players { flex-wrap: wrap; gap: 8px; }
.rules-line { color: var(--muted); text-align: center; font-size: 14px; }
.hand { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px; border: 2px solid transparent; border-radius: 10px; }
.hand.active { border-color: var(--gold); }
.hand-cards { display: flex; }
.hand-cards > * + * { margin-left: -16px; }
.hand-label { font-size: 14px; }
.actions .btn { flex: 1 1 96px; }

/* Drills */
.score-row { display: flex; justify-content: space-between; color: var(--gold); font-weight: 700; flex-wrap: wrap; gap: 6px; }
.flash { display: flex; gap: 16px; justify-content: center; min-height: 170px; align-items: center; padding-top: 20px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.guess { font-size: 26px; font-weight: 800; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }
.guess.big, .big { font-size: 26px; font-weight: 800; }
.lbl { color: var(--muted); font-weight: 600; font-size: 14px; }
.seg { display: flex; background: var(--felt-deep); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--ink); font: 600 14px var(--font-body); padding: 8px 4px; border-radius: 9px; cursor: pointer; }
.seg button.on { background: var(--gold); color: var(--card-ink); }

/* Chart */
.chart-wrap { overflow-x: auto; }
.chart { border-collapse: separate; border-spacing: 2px; width: 100%; min-width: 340px; font-variant-numeric: tabular-nums; }
.chart th { color: var(--gold); font-size: 13px; padding: 2px; }
.chart td { text-align: center; font-weight: 700; font-size: 12px; color: var(--card-ink); border-radius: 3px; height: 28px; }
.c-H { background: #d9d9d9; color: var(--card-ink); }
.c-S { background: #f2c94c; color: var(--card-ink); }
.c-D { background: #6fcf97; color: var(--card-ink); }
.c-P { background: #56ccf2; color: var(--card-ink); }
.c-R { background: #eb8b8b; color: var(--card-ink); }
.legend { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.legend li { display: flex; align-items: center; gap: 10px; }
.legend span { width: 34px; text-align: center; font-weight: 700; font-size: 12px; border-radius: 3px; padding: 2px 0; }

/* Settings */
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 4px 0; cursor: pointer; }
.toggle span { display: flex; flex-direction: column; min-width: 0; }
.toggle small { color: var(--muted); font-size: 13px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--gold); flex: none; }

/* Ad placeholders (real ads only run in the mobile app) */
.ad-strip {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: #111; color: #9aa; border-top: 1px dashed #555;
  text-align: center; font-size: 12px; line-height: 50px; letter-spacing: 0.04em;
}
.ad-overlay { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, 0.85); display: grid; place-items: center; padding: 16px; }
.ad-box { background: #1b1b1b; color: #ddd; border: 1px dashed #666; border-radius: 12px; padding: 28px 20px; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
.ad-box b { color: #fff; font-size: 18px; }

/* Deal and flip animations; timings come from src/engine/dealSchedule.ts */
.deal-in { animation: deal-in 340ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes deal-in {
  from { opacity: 0; transform: translate(140px, -220px) rotate(-25deg); }
  30% { opacity: 1; }
  to { opacity: 1; transform: none; }
}
.flipper { position: relative; flex: none; transform-style: preserve-3d; animation: flip-over 260ms ease-in-out both; }
.flipper.md { width: 64px; height: 92px; }
.flipper.sm { width: 46px; height: 66px; }
.flipper > * { position: absolute; inset: 0; backface-visibility: hidden; }
.flipper .face-back { transform: rotateY(180deg); }
@keyframes flip-over { from { transform: rotateY(180deg); } to { transform: rotateY(0deg); } }

/* ---------- Juice ---------- */

/* Slow swirling felt behind everything. */
body::before {
  content: ""; position: fixed; inset: -50%; z-index: -1; pointer-events: none;
  background: conic-gradient(from 0deg at 50% 50%, var(--felt-deep), var(--felt), var(--felt-lift), var(--felt), var(--felt-deep), var(--felt-lift), var(--felt-deep));
  filter: blur(60px); opacity: 0.55;
  animation: swirl 60s linear infinite;
}
@keyframes swirl { to { transform: rotate(360deg); } }

/* Cards on the table idle with a gentle sway (staggered), and lean toward the mouse. */
.hand .card, .drill .card {
  animation: sway 3.4s ease-in-out infinite;
  transform: perspective(500px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.15s ease-out, box-shadow 0.15s;
}
.hand .card-wrap:nth-child(2n) .card { animation-delay: -1.1s; animation-duration: 3.9s; }
.hand .card-wrap:nth-child(3n) .card { animation-delay: -2.3s; animation-duration: 3.1s; }
@keyframes sway { 0%, 100% { rotate: -1.2deg; translate: 0 1px; } 50% { rotate: 1.2deg; translate: 0 -1px; } }
.card.tilt { z-index: 2; box-shadow: 0 10px 18px var(--shade); transform: perspective(500px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.08); }
.card.tilt::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(circle at var(--shine-x, 50%) var(--shine-y, 50%), rgba(255, 255, 255, 0.45), transparent 60%);
  mix-blend-mode: soft-light;
}

/* Screen shake. */
#app.shaking { animation: shake 320ms linear; }
@keyframes shake {
  0%, 100% { translate: 0 0; }
  15% { translate: var(--shake) 0; }
  30% { translate: calc(var(--shake) * -0.8) calc(var(--shake) * 0.2); }
  45% { translate: calc(var(--shake) * 0.6) 0; }
  60% { translate: calc(var(--shake) * -0.4) calc(var(--shake) * -0.15); }
  75% { translate: calc(var(--shake) * 0.25) 0; }
}

/* Bankroll pulses as winnings count up. */
.bankroll.bump { animation: bump 130ms ease-out; }
@keyframes bump { 50% { scale: 1.14; color: var(--ink); } }

/* Streak badge. */
.streak {
  align-self: center; transform: rotate(-4deg);
  background: var(--felt-deep); color: var(--gold); border: 2px solid var(--gold);
  border-radius: 999px; padding: 2px 12px; font-weight: 900; letter-spacing: 0.08em; font-size: 14px;
}
.streak.hot { background: var(--gold); color: var(--card-ink); box-shadow: 0 0 16px var(--gold); }
.streak.pop { animation: badge-pop 380ms cubic-bezier(0.34, 1.8, 0.64, 1); }
@keyframes badge-pop { from { scale: 1.6; } to { scale: 1; } }

/* Effects layer: chip particles and the score pop-up. */
#fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
.fx-popup {
  position: fixed; z-index: 9; pointer-events: none; white-space: nowrap;
  font: 900 36px/1 var(--font-display); letter-spacing: 0.04em;
  text-shadow: 0 4px 0 rgba(0, 0, 0, 0.55);
  translate: -50% -50%; opacity: 0;
}
.fx-popup.big { font-size: 48px; }
.fx-popup.gold { color: var(--gold); }
.fx-popup.good { color: var(--good); }
.fx-popup.bad { color: var(--bad); }
.fx-popup.plain { color: var(--ink); }
.fx-popup.muted { color: var(--muted); }
.fx-popup.show { animation: popup 1500ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes popup {
  0% { opacity: 0; scale: 0.3; rotate: -10deg; }
  18% { opacity: 1; scale: 1.08; rotate: -3deg; }
  28% { scale: 1; }
  75% { opacity: 1; translate: -50% -50%; }
  100% { opacity: 0; translate: -50% -110%; rotate: -3deg; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .fx-popup.show { opacity: 1; }
}
</style>

<header class="bar"><div class="bar-inner"><a id="back" href="#home" aria-label="Back" hidden>‹</a><h1 id="screen-title">Blackjack Coach</h1></div></header>
<main id="app"></main>
<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div id="fx-popup" class="fx-popup" aria-live="polite"></div>
<div class="ad-strip" aria-hidden="true">AD BANNER PREVIEW · real ads run in the mobile app</div>
<div class="ad-overlay" id="ad-overlay" role="dialog" aria-label="Ad preview" hidden>
  <div class="ad-box">
    <b>Interstitial ad preview</b>
    <p>In the mobile app, a full-screen ad appears here between hands, at most every 10 hands and every 3 minutes.</p>
    <button class="btn primary" id="ad-close">Close</button>
  </div>
</div>
